name: Public Runner - Advance

on:
  workflow_dispatch:
    inputs:
      date_code:
        description: Optional YYYYMMDD override. If empty, defaults to tomorrow (IST).
        required: false
        type: string
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: public-runner-advance
  cancel-in-progress: false

jobs:
  run-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRIVATE_SCRAPER_REPO: ${{ secrets.PRIVATE_SCRAPER_REPO }}
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      INPUT_DATE_CODE: ${{ github.event.inputs.date_code || '' }}

    steps:
      - name: Preflight validation
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_SCRAPER_REPO##*/}"
          missing=0
          for key in PRIVATE_SCRAPER_REPO PRIVATE_REPO_READ_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SCRAPER_REPO }}
          ref: main
          token: ${{ env.PRIVATE_REPO_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: private-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: private-src
        run: python -m playwright install --with-deps chromium

      - name: Resolve DATE_CODE
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os

          override = (os.getenv("INPUT_DATE_CODE") or "").strip()
          ist = timezone(timedelta(hours=5, minutes=30))
          value = (override or (datetime.now(ist) + timedelta(days=1)).strftime("%Y%m%d")).strip()

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
            f.write(f"DATE_CODE={value}\n")

          print(f"Using DATE_CODE={value!r}")
          PY

      - name: Sanitize DATE_CODE
        shell: bash
        run: |
          DATE_CODE="$(printf '%s' "${DATE_CODE}" | tr -d '\r\n' | xargs)"
          echo "DATE_CODE=$DATE_CODE" >> "$GITHUB_ENV"

      - name: Scrape
        working-directory: private-src
        env:
          SCRAPE_MODE: advance
          SHARD_IDS: 1-9
          DATE_CODE: ${{ env.DATE_CODE }}
        run: xvfb-run -a python railway_runner.py

      - name: Commit & Push
        working-directory: private-src
        env:
          GITHUB_TOKEN: ${{ env.PRIVATE_REPO_READ_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add advance/data/ || true
          git commit -m "BMS Advance Scrape (${{ env.DATE_CODE }})" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main || true
