name: Public Runner - Advance Date

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-runner-advance-date
  cancel-in-progress: false

jobs:
  run-advance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PRIVATE_SCRAPER_REPO: ${{ secrets.PRIVATE_SCRAPER_REPO }}
      PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}

    steps:
      - name: Preflight validation
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${PRIVATE_SCRAPER_REPO##*/}"
          missing=0
          for key in PRIVATE_SCRAPER_REPO PRIVATE_REPO_READ_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::$key is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_SCRAPER_REPO }}
          ref: railway-job
          token: ${{ env.PRIVATE_REPO_READ_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        working-directory: private-src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        working-directory: private-src
        run: python -m playwright install --with-deps chromium

      - name: Set DATE_CODE
        run: echo "DATE_CODE=20260925" >> "$GITHUB_ENV"

      - name: Scrape
        working-directory: private-src
        env:
          SCRAPE_MODE: advance
          SHARD_IDS: 1-9
          DATE_CODE: ${{ env.DATE_CODE }}
        run: xvfb-run -a python railway_runner.py

      - name: Commit & Push
        working-directory: private-src
        env:
          GITHUB_TOKEN: ${{ env.PRIVATE_REPO_READ_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/advance/data/ || true
          git commit -m "BMS Advance Date Scrape (${{ env.DATE_CODE }})" || echo "No changes"
          git pull --rebase origin railway-job || true
          git push origin railway-job || true
